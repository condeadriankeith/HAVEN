<!DOCTYPE html>
<html>
<head>
    <title>HAVEN Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff; /* Light theme background */
            color: #000000; /* Black text */
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .marker-highlight {
            filter: hue-rotate(180deg) saturate(2);
        }
        .lottie-marker {
            width: 40px;
            height: 40px;
        }
        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
                box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
            }
            70% {
                transform: scale(1.2);
                opacity: 0.5;
                box-shadow: 0 0 0 15px rgba(255, 59, 48, 0);
            }
            100% {
                transform: scale(0.8);
                opacity: 0.8;
                box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
            }
        }
        
        /* Vet hub marker */
        .vet-hub-marker {
            width: 20px;
            height: 20px;
            background-color: #4CAF50;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize map
        var map = L.map('map').setView([10.6765, 122.9509], 15);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Add vet hub marker (SM City Bacolod)
        const vetHubMarker = L.marker([10.6722, 122.9443], {
            icon: L.divIcon({
                className: 'lottie-marker',
                iconSize: [24, 24],
                iconAnchor: [12, 12],
                html: '<div class="vet-hub-marker"></div>'
            })
        }).addTo(map)
          .bindPopup('<b>Vet Hub</b><br>SM City Bacolod')
          .openPopup();
        
        var markers = {};
        
        // Function to create Lottie marker icon
        function createLottieIcon() {
            var icon = L.divIcon({
                className: 'lottie-marker',
                html: '<div class="lottie-container" style="width: 40px; height: 40px;"><div class="pulse-circle" style="width: 20px; height: 20px; background-color: #ff3b30; border-radius: 50%; position: relative; animation: pulse 1.5s infinite ease-out; margin: 10px;"></div></div>',
                iconSize: [40, 40],
                iconAnchor: [20, 40],
                popupAnchor: [0, -40]
            });
            return icon;
        }
        
        // Add marker function (called from Java)
        function addMarker(lat, lng, title, highlight) {
            var markerIcon = createLottieIcon();
            var marker = L.marker([lat, lng], {icon: markerIcon}).addTo(map)
                .bindPopup(title);
            
            var id = 'marker_' + lat + '_' + lng;
            markers[id] = marker;
            
            if (highlight) {
                marker.openPopup();
            }
            
            return id;
        }
        
        // Center on location function (called from Java)
        function centerOn(lat, lng) {
            map.setView([lat, lng], 16);
        }
        
        // Highlight marker function (called from Java)
        function highlightMarker(lat, lng) {
            var id = 'marker_' + lat + '_' + lng;
            if (markers[id]) {
                markers[id].openPopup();
            }
        }
        
        // Draw route function (called from Java)
        function drawRoute(coordinates) {
            // Remove existing route if present
            if (window.routeLine) {
                map.removeLayer(window.routeLine);
            }
            
            // Create new polyline with red color to match UI
            window.routeLine = L.polyline(coordinates, {
                color: '#ff0000',
                weight: 4,
                opacity: 0.8
            }).addTo(map);
            
            // Fit map to show both vet hub and emergency location
            var bounds = L.latLngBounds([
                [10.6722, 122.9443], // Vet hub
                coordinates[coordinates.length - 1] // Last point (emergency location)
            ]);
            map.fitBounds(bounds, {padding: [50, 50]});
        }
        
        // Hide route function (called from Java)
        function hideRoute() {
            if (window.routeLine) {
                map.removeLayer(window.routeLine);
                window.routeLine = null;
            }
        }
    </script>
</body>
</html>
