<!DOCTYPE html>
<html>
<head>
    <title>HAVEN Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        
        /* Animated pulse marker - using red color to match UI */
        .pulse-marker {
            border-radius: 50%;
            background-color: #ff0000; /* Red color to match UI */
            animation: 1.5s pulse infinite ease-in-out;
            cursor: pointer;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); /* Red color */
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); /* Red color */
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); /* Red color */
            }
        }
        
        /* Highlighted marker - darker red for contrast */
        .highlighted-marker {
            background-color: #cc0000; /* Darker red */
            animation: 1.5s highlight-pulse infinite ease-in-out;
        }
        
        @keyframes highlight-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(204, 0, 0, 0.7); /* Darker red */
            }
            70% {
                box-shadow: 0 0 0 10px rgba(204, 0, 0, 0); /* Darker red */
            }
            100% {
                box-shadow: 0 0 0 0 rgba(204, 0, 0, 0); /* Darker red */
            }
        }
        
        /* Response button in popup */
        .response-btn {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 8px;
        }
        
        .response-btn:hover {
            background-color: #ff1a1a;
        }
        
        /* Vet hub marker */
        .vet-hub-marker {
            width: 20px;
            height: 20px;
            background-color: #4CAF50;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Initialize map
        var map = L.map('map').setView([10.6765, 122.9509], 15);
        
        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Add vet hub marker (SM City Bacolod)
        const vetHubMarker = L.marker([10.6722, 122.9443], {
            icon: L.divIcon({
                className: 'vet-hub-marker',
                iconSize: [24, 24],
                iconAnchor: [12, 12],
                html: '<div class="vet-hub-marker"></div>'
            })
        }).addTo(map)
          .bindPopup('<b>Vet Hub</b><br>SM City Bacolod');
        
        var markers = {};
        
        // Create custom icon with pulse effect
        function createPulseIcon(highlighted) {
            var className = highlighted ? 'pulse-marker highlighted-marker' : 'pulse-marker';
            return L.divIcon({
                className: className,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });
        }
        
        // Add marker function (called from Java)
        function addMarker(lat, lng, title, highlight, emergencyId) {
            var icon = createPulseIcon(highlight);
            var marker = L.marker([lat, lng], {icon: icon}).addTo(map);
            
            // Create popup content with response button
            var popupContent = '<div>' + 
                '<h3>' + title + '</h3>' +
                '<button class="response-btn" onclick="respondToEmergency(\'' + emergencyId + '\')">Respond to Emergency</button>' +
                '</div>';
            
            marker.bindPopup(popupContent);
            
            var id = 'marker_' + lat + '_' + lng;
            markers[id] = marker;
            
            if (highlight) {
                marker.openPopup();
            }
            
            return id;
        }
        
        // Respond to emergency function (called when response button is clicked)
        function respondToEmergency(emergencyId) {
            // Send message to Java application
            if (typeof javaRespondToEmergency !== 'undefined') {
                javaRespondToEmergency(emergencyId);
            } else {
                alert('Responding to emergency: ' + emergencyId);
            }
        }
        
        // Center on location function (called from Java)
        function centerOn(lat, lng) {
            map.setView([lat, lng], 16);
        }
        
        // Highlight marker function (called from Java)
        function highlightMarker(lat, lng) {
            var id = 'marker_' + lat + '_' + lng;
            if (markers[id]) {
                markers[id].openPopup();
            }
        }
        
        // Clear all markers function (called from Java)
        function clearMarkers() {
            for (var id in markers) {
                map.removeLayer(markers[id]);
            }
            markers = {};
        }
        
        // Draw route function (called from Java)
        function drawRoute(coordinates) {
            // Remove existing route if present
            if (window.routeLine) {
                map.removeLayer(window.routeLine);
            }
            
            // Create new polyline with red color to match UI
            window.routeLine = L.polyline(coordinates, {
                color: '#ff0000',
                weight: 4,
                opacity: 0.8
            }).addTo(map);
            
            // Fit map to show both vet hub and emergency location
            var bounds = L.latLngBounds([
                [10.6722, 122.9443], // Vet hub
                coordinates[coordinates.length - 1] // Last point (emergency location)
            ]);
            map.fitBounds(bounds, {padding: [50, 50]});
        }
        
        // Hide route function (called from Java)
        function hideRoute() {
            if (window.routeLine) {
                map.removeLayer(window.routeLine);
                window.routeLine = null;
            }
        }
    </script>
</body>
</html>
